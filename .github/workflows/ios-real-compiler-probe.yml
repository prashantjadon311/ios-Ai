name: ios-real-compiler-probe
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'repair/**'
  pull_request:
    branches:
      - 'main'
permissions:
  contents: read

jobs:
  verify:
    name: Static Contract & Schema Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run V3 Handoff Validator
        run: python3 docs/spec/v3/20_VALIDATE_HANDOFF.py

      - name: Run Test Matrix Verification Suite (T001-T028, S001-S018)
        run: python3 scratch/verify_matrix.py

      - name: Run Chat Vertical Slice Test
        run: python3 scratch/test_chat_slice.py

  portable-swift-tests:
    name: Portable Swift Core Tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select installed compatible Xcode
        shell: bash
        run: |
          set -euo pipefail
          chosen=''
          for app in /Applications/Xcode_26.1.1.app /Applications/Xcode_26.0.1.app /Applications/Xcode_26.2.app /Applications/Xcode_26.3.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app /Applications/Xcode.app /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app; do
            if [[ -d "$app/Contents/Developer" ]]; then chosen="$app"; break; fi
          done
          if [[ -z "$chosen" ]]; then echo 'No compatible Xcode found. Inspect runner image.'; exit 20; fi
          sudo xcode-select -s "$chosen/Contents/Developer"
          swift --version

      - name: Set up Python for portable source sync
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify and sync production Foundation sources
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/implementation/release_repair_v2/scripts/sync_portable_sources.py .

      - name: Run executable Swift XCTest suite
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path docs/implementation/release_repair_v2/portable_core_tests \
            2>&1 | tee "$RUNNER_TEMP/portable-tests.log"

      - name: Upload portable test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-swift-test-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/portable-tests.log

  catalyst-swift-compile:
    name: Apple Swift Compiler (Mac Catalyst)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select installed compatible Xcode
        shell: bash
        run: |
          set -euo pipefail
          chosen=''
          for app in /Applications/Xcode_26.1.1.app /Applications/Xcode_26.0.1.app /Applications/Xcode_26.2.app /Applications/Xcode_26.3.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app /Applications/Xcode.app /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app; do
            if [[ -d "$app/Contents/Developer" ]]; then chosen="$app"; break; fi
          done
          if [[ -z "$chosen" ]]; then echo 'No compatible Xcode found.'; exit 77; fi
          sudo xcode-select -s "$chosen/Contents/Developer"
          export DEVELOPER_DIR="$chosen/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Check ORIGINAL app candidate manifest and resources
        shell: bash
        run: |
          set -euo pipefail
          test -f PersonalAssistant.swiftpm/Package.swift
          test -f PersonalAssistant.swiftpm/Resources/en.lproj/Localizable.strings
          test -f PersonalAssistant.swiftpm/Resources/hi.lproj/Localizable.strings
          test -f PersonalAssistant.swiftpm/Resources/Assets.xcassets/Maya.imageset/Maya.png
          test -f PersonalAssistant.swiftpm/Resources/Assets.xcassets/Saar.imageset/Saar.png
          grep -Eq 'defaultLocalization:[[:space:]]*"en"' PersonalAssistant.swiftpm/Package.swift

      - name: Compile ORIGINAL app with Apple Swift Compiler (Mac Catalyst)
        working-directory: PersonalAssistant.swiftpm
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/PersonalAssistant-Catalyst.xcresult"
          xcodebuild -scheme PersonalAssistant \
            -destination "platform=macOS,variant=Mac Catalyst" \
            -resultBundlePath "$RUNNER_TEMP/PersonalAssistant-Catalyst.xcresult" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/catalyst-build.log"

      - name: Upload Apple Catalyst compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-catalyst-compiler-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/catalyst-build.log
            ${{ runner.temp }}/PersonalAssistant-Catalyst.xcresult

  apple-ios-build:
    name: Apple iOS App Build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Audit installed Xcode candidates and select compatible toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-diagnostics"

          echo "=== AVAILABLE XCODE APPLICATIONS ===" | tee "$RUNNER_TEMP/ios-diagnostics/xcode-candidates.log"
          ls -la /Applications/Xcode* | tee -a "$RUNNER_TEMP/ios-diagnostics/xcode-candidates.log" || true

          chosen=''
          for app in /Applications/Xcode_26.1.1.app /Applications/Xcode_26.0.1.app /Applications/Xcode_26.2.app /Applications/Xcode_26.3.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app /Applications/Xcode.app /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app; do
            if [[ -d "$app/Contents/Developer" ]]; then
              echo "Inspecting candidate: $app"
              export DEVELOPER_DIR="$app/Contents/Developer"
              sdk_ver=$(xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null || true)
              echo "  iphonesimulator SDK: $sdk_ver"
              chosen="$app"
              break
            fi
          done

          if [[ -z "$chosen" ]]; then
            echo "E01: No compatible Xcode candidate installed."
            exit 77
          fi

          echo "Selected Xcode: $chosen"
          sudo xcode-select -s "$chosen/Contents/Developer"
          export DEVELOPER_DIR="$chosen/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

          xcodebuild -version | tee -a "$RUNNER_TEMP/ios-diagnostics/xcode-version.log"
          xcodebuild -showsdks | tee -a "$RUNNER_TEMP/ios-diagnostics/xcode-sdks.log"
          xcrun --sdk iphoneos --show-sdk-version | tee -a "$RUNNER_TEMP/ios-diagnostics/iphoneos-sdk.log" || true
          xcrun --sdk iphonesimulator --show-sdk-version | tee -a "$RUNNER_TEMP/ios-diagnostics/iphonesimulator-sdk.log" || true

      - name: Check ORIGINAL app candidate manifest and resources
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f PersonalAssistant.swiftpm/Package.swift
          test -f PersonalAssistant.swiftpm/Resources/en.lproj/Localizable.strings
          test -f PersonalAssistant.swiftpm/Resources/hi.lproj/Localizable.strings
          test -f PersonalAssistant.swiftpm/Resources/Assets.xcassets/Maya.imageset/Maya.png
          test -f PersonalAssistant.swiftpm/Resources/Assets.xcassets/Saar.imageset/Saar.png
          if grep -Eq 'defaultLocalization:[[:space:]]*"en"' PersonalAssistant.swiftpm/Package.swift; then
            echo 'fixed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'fixed=false' >> "$GITHUB_OUTPUT"
            echo 'Original Playgrounds manifest missing defaultLocalization: shipping blocked.'
            exit 22
          fi

      - name: Discover and verify iOS destinations
        working-directory: PersonalAssistant.swiftpm
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list 2>&1 | tee "$RUNNER_TEMP/ios-diagnostics/scheme-list.log"
          DEST_OUTPUT=$(xcodebuild -showdestinations -scheme PersonalAssistant 2>&1 || true)
          echo "$DEST_OUTPUT" | tee "$RUNNER_TEMP/ios-destinations.log"

          AVAILABLE_SECTION=$(echo "$DEST_OUTPUT" | sed -n '/Available destinations/,/Ineligible destinations/p')

          ELIGIBLE_IOS_DEST=""
          if echo "$AVAILABLE_SECTION" | grep -Eq 'platform:[[:space:]]*iOS Simulator'; then
            ELIGIBLE_IOS_DEST="generic/platform=iOS Simulator"
          elif echo "$AVAILABLE_SECTION" | grep -Eq 'platform:[[:space:]]*iOS,'; then
            ELIGIBLE_IOS_DEST="generic/platform=iOS"
          fi

          if [[ -n "$ELIGIBLE_IOS_DEST" ]]; then
            echo "Eligible iOS destination found: $ELIGIBLE_IOS_DEST"
            echo "ELIGIBLE_IOS_DEST=$ELIGIBLE_IOS_DEST" >> "$GITHUB_ENV"
          else
            echo "=========================================================="
            echo "CLASSIFICATION: ENVIRONMENT_BLOCKED"
            echo "=========================================================="
            echo "Declared minimum deployment target in Package.swift: iOS 18.6"
            echo "Available destinations contain no eligible iOS platform runtime."
            echo "Stopping Apple build job with ENVIRONMENT_BLOCKED classification."
            echo "=========================================================="
            exit 77
          fi

      - name: Compile and link ORIGINAL iOS application
        working-directory: PersonalAssistant.swiftpm
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/PersonalAssistant-iOS.xcresult" "$RUNNER_TEMP/DerivedData"
          xcodebuild -scheme PersonalAssistant \
            -destination "$ELIGIBLE_IOS_DEST" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/PersonalAssistant-iOS.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/ios-app-build.log"

      - name: Package and verify unsigned application artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name "PersonalAssistant.app" -type d | head -n 1)
          if [[ -n "$APP_PATH" && -d "$APP_PATH" ]]; then
            echo "Built app bundle located at: $APP_PATH"
            (cd "$(dirname "$APP_PATH")" && zip -r "$RUNNER_TEMP/artifacts/PersonalAssistant-unsigned-app.zip" "$(basename "$APP_PATH")")
            echo "Zipped app artifact: $RUNNER_TEMP/artifacts/PersonalAssistant-unsigned-app.zip"
            echo "APP_ARTIFACT_BUILT=true" >> "$GITHUB_ENV"
          else
            echo "PersonalAssistant.app directory not found in DerivedData products."
            echo "APP_ARTIFACT_BUILT=false" >> "$GITHUB_ENV"
          fi

      - name: Upload Apple iOS build evidence and application artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-ios-build-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ios-diagnostics/
            ${{ runner.temp }}/ios-destinations.log
            ${{ runner.temp }}/ios-app-build.log
            ${{ runner.temp }}/PersonalAssistant-iOS.xcresult
            ${{ runner.temp }}/artifacts/PersonalAssistant-unsigned-app.zip
