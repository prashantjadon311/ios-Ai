name: ios-real-compiler-probe
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'repair/**'
  pull_request:
    branches:
      - 'main'
permissions:
  contents: read

jobs:
  portable-swift-tests:
    name: Portable Swift Core Tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select installed compatible Xcode
        shell: bash
        run: |
          set -euo pipefail
          chosen=''
          for app in /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode_16.0.app /Applications/Xcode.app /Applications/Xcode_16.3.app /Applications/Xcode_15.4.app; do
            if [[ -d "$app/Contents/Developer" ]]; then chosen="$app"; break; fi
          done
          if [[ -z "$chosen" ]]; then echo 'No compatible Xcode found. Inspect runner image.'; exit 20; fi
          sudo xcode-select -s "$chosen/Contents/Developer"
          swift --version

      - name: Set up Python for portable source sync
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify and sync production Foundation sources
        shell: bash
        run: |
          set -euo pipefail
          python3 docs/implementation/release_repair_v2/scripts/sync_portable_sources.py .

      - name: Run executable Swift XCTest suite
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path docs/implementation/release_repair_v2/portable_core_tests \
            2>&1 | tee "$RUNNER_TEMP/portable-tests.log"

      - name: Upload portable test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-swift-test-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/portable-tests.log

  catalyst-swift-compile:
    name: Apple Swift Compiler (Mac Catalyst)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select installed compatible Xcode
        shell: bash
        run: |
          set -euo pipefail
          chosen=''
          for app in /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode_16.0.app /Applications/Xcode.app /Applications/Xcode_16.3.app /Applications/Xcode_15.4.app; do
            if [[ -d "$app/Contents/Developer" ]]; then chosen="$app"; break; fi
          done
          if [[ -z "$chosen" ]]; then echo 'No compatible Xcode found. Inspect runner image.'; exit 20; fi
          sudo xcode-select -s "$chosen/Contents/Developer"
          xcodebuild -version

      - name: Verify ORIGINAL app candidate manifest and resources
        shell: bash
        run: |
          set -euo pipefail
          test -f PersonalAssistant.swiftpm/Package.swift
          test -f PersonalAssistant.swiftpm/Resources/en.lproj/Localizable.strings
          test -f PersonalAssistant.swiftpm/Resources/hi.lproj/Localizable.strings
          test -f PersonalAssistant.swiftpm/Resources/Assets.xcassets/Maya.imageset/Maya.png
          test -f PersonalAssistant.swiftpm/Resources/Assets.xcassets/Saar.imageset/Saar.png
          grep -Eq 'defaultLocalization:[[:space:]]*"en"' PersonalAssistant.swiftpm/Package.swift

      - name: Compile ORIGINAL app with Apple Swift Compiler (Mac Catalyst)
        working-directory: PersonalAssistant.swiftpm
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/PersonalAssistant-Catalyst.xcresult"
          xcodebuild -scheme PersonalAssistant \
            -destination "platform=macOS,variant=Mac Catalyst" \
            -resultBundlePath "$RUNNER_TEMP/PersonalAssistant-Catalyst.xcresult" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/catalyst-build.log"

      - name: Upload Apple Swift compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-catalyst-compiler-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/catalyst-build.log
            ${{ runner.temp }}/PersonalAssistant-Catalyst.xcresult

  apple-app-build:
    name: Apple iOS App Build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Audit installed Xcode candidates, SDKs and destinations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-diagnostics"

          echo "=== AVAILABLE XCODE APPLICATIONS ===" | tee "$RUNNER_TEMP/ios-diagnostics/xcode-candidates.log"
          ls -la /Applications/Xcode* | tee -a "$RUNNER_TEMP/ios-diagnostics/xcode-candidates.log" || true

          echo "=== DETAILED XCODE & DESTINATION AUDIT ===" | tee "$RUNNER_TEMP/ios-diagnostics/destinations-audit.log"
          for app in /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode_16.0.app /Applications/Xcode.app; do
            if [[ -d "$app/Contents/Developer" ]]; then
              echo ">>> INSPECTING: $app" | tee -a "$RUNNER_TEMP/ios-diagnostics/destinations-audit.log"
              sudo xcode-select -s "$app/Contents/Developer" || true
              xcodebuild -version | tee -a "$RUNNER_TEMP/ios-diagnostics/destinations-audit.log" || true
              xcodebuild -showsdks | tee -a "$RUNNER_TEMP/ios-diagnostics/destinations-audit.log" || true
              (cd PersonalAssistant.swiftpm && xcodebuild -list 2>&1 | tee -a "$RUNNER_TEMP/ios-diagnostics/destinations-audit.log") || true
              (cd PersonalAssistant.swiftpm && xcodebuild -showdestinations -scheme PersonalAssistant 2>&1 | tee -a "$RUNNER_TEMP/ios-diagnostics/destinations-audit.log") || true
            fi
          done

      - name: Verify ORIGINAL app candidate manifest and resources
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f PersonalAssistant.swiftpm/Package.swift
          test -f PersonalAssistant.swiftpm/Resources/en.lproj/Localizable.strings
          test -f PersonalAssistant.swiftpm/Resources/hi.lproj/Localizable.strings
          test -f PersonalAssistant.swiftpm/Resources/Assets.xcassets/Maya.imageset/Maya.png
          test -f PersonalAssistant.swiftpm/Resources/Assets.xcassets/Saar.imageset/Saar.png
          if grep -Eq 'defaultLocalization:[[:space:]]*"en"' PersonalAssistant.swiftpm/Package.swift; then
            echo 'fixed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'fixed=false' >> "$GITHUB_OUTPUT"
            echo 'Original Playgrounds manifest still missing defaultLocalization: shipping blocked.'
          fi

      - name: Compile ORIGINAL iPad candidate when compatible iOS platform exists
        working-directory: PersonalAssistant.swiftpm
        shell: bash
        run: |
          set -euo pipefail
          chosen=''
          for app in /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app /Applications/Xcode.app; do
            if [[ -d "$app/Contents/Developer" ]]; then chosen="$app"; break; fi
          done
          sudo xcode-select -s "$chosen/Contents/Developer"

          DEST_OUTPUT=$(xcodebuild -showdestinations -scheme PersonalAssistant 2>&1 || true)
          echo "$DEST_OUTPUT" | tee "$RUNNER_TEMP/ios-destinations.log"

          # Available destinations appear before Ineligible destinations in xcodebuild output
          AVAILABLE_SECTION=$(echo "$DEST_OUTPUT" | sed -n '/Available destinations/,/Ineligible destinations/p')

          ELIGIBLE_IOS_DEST=""
          if echo "$AVAILABLE_SECTION" | grep -Eq 'platform:[[:space:]]*iOS,'; then
            ELIGIBLE_IOS_DEST="generic/platform=iOS"
          elif echo "$AVAILABLE_SECTION" | grep -Eq 'platform:[[:space:]]*iOS Simulator'; then
            ELIGIBLE_IOS_DEST="generic/platform=iOS Simulator"
          fi

          if [[ -n "$ELIGIBLE_IOS_DEST" ]]; then
            echo "Eligible iOS destination found: $ELIGIBLE_IOS_DEST"
            set -o pipefail
            rm -rf "$RUNNER_TEMP/PersonalAssistant-iOS.xcresult"
            xcodebuild -scheme PersonalAssistant \
              -destination "$ELIGIBLE_IOS_DEST" \
              -resultBundlePath "$RUNNER_TEMP/PersonalAssistant-iOS.xcresult" \
              CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/ios-app-build.log"
          else
            echo "=========================================================="
            echo "CLASSIFICATION: ENVIRONMENT_BLOCKED"
            echo "=========================================================="
            echo "Declared minimum deployment target in Package.swift: iOS 18.6"
            echo "Installed Xcode: $chosen"
            echo "Available destinations for PersonalAssistant scheme contain no eligible iOS platform runtime."
            echo "Apple device platform requires downloading separate platform bundle or runner image with preinstalled iOS 18.6 SDK."
            echo "Per Phase 3 contract: Stopping Apple build job with ENVIRONMENT_BLOCKED classification and retaining full environment diagnostics."
            echo "=========================================================="
            exit 77
          fi

      - name: Upload Apple iOS build and environment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-ios-build-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ios-diagnostics/
            ${{ runner.temp }}/ios-destinations.log
            ${{ runner.temp }}/ios-app-build.log
            ${{ runner.temp }}/PersonalAssistant-iOS.xcresult
