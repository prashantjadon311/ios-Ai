name: iOS Build & Verify

on:
  push:
    branches: [ main, 'repair/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Static Contract & Schema Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run V3 Handoff Validator
        run: python3 docs/spec/v3/20_VALIDATE_HANDOFF.py

      - name: Run Test Matrix Verification Suite (T001-T028, S001-S018)
        run: python3 scratch/verify_matrix.py

      - name: Run Chat Vertical Slice Test
        run: python3 scratch/test_chat_slice.py

  build-ios:
    name: Xcode iOS Build Verification
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select installed compatible Xcode
        shell: bash
        run: |
          set -euo pipefail
          chosen=''
          for app in /Applications/Xcode_26.1.1.app /Applications/Xcode_26.0.1.app /Applications/Xcode_26.2.app /Applications/Xcode_26.3.app /Applications/Xcode_26.1.app /Applications/Xcode_26.0.app /Applications/Xcode.app /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app; do
            if [[ -d "$app/Contents/Developer" ]]; then chosen="$app"; break; fi
          done
          if [[ -z "$chosen" ]]; then echo "No compatible Xcode found"; exit 77; fi
          sudo xcode-select -s "$chosen/Contents/Developer"
          export DEVELOPER_DIR="$chosen/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Build Swift Playgrounds App Target
        working-directory: PersonalAssistant.swiftpm
        run: |
          set -euo pipefail
          xcodebuild -scheme PersonalAssistant \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
